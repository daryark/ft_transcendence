events {
}

http {
    log_format elk_logging escape=json '{'
    '"timestamp": "$time_iso8601",'
    '"remote_addr": "$http_x_forwarded_for",'
    '"proxy_addr": "$remote_addr",'
    '"request": "$request",'
    '"status": "$status",'
    '"body_bytes_sent": "$body_bytes_sent",'
    '"http_user_agent": "$http_user_agent"'
    '}';
    access_log /var/log/nginx/access.log elk_logging;
    server{
        listen      443 ssl;
        #server_name  ft-transcendence.42.fr www.ft-transcendence.42.fr;
        ssl_certificate     /etc/nginx/ssl/transendence.42.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/transendence.42.fr.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        #listen 80;
        access_log /var/log/nginx/frontend_access.log elk_logging;
        error_log /var/log/nginx/frontend_error.log;
        location / {
            proxy_pass http://frontend:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/(.*) {
            proxy_pass http://backend:3000;
        }
        location /kibana/ {
            proxy_pass http://kibana:5601/kibana/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 8080;
        server_name localhost;
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
    